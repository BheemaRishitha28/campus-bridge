<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="One Campus. Every Placement. Every Clearance. Connected. CampusBridge is the university placement and departmental clearance intelligence platform." />
    <title>CampusBridge | University Placement & Department No-Dues Intelligence Platform</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('campusbridge_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
